<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meet ADAM, a student at Kobe Institute of Computing.">
  <title>ADAM | Introduction</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172a35;
      --muted: #52646b;
      --paper: #f7f5ed;
      --green: #c9e8d2;
      --coral: #f1785d;
      --yellow: #f5cd65;
      --blue: #287c82;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", "Avenir Next", sans-serif;
    }

    .page {
      width: min(100% - 40px, 1040px);
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 20px;
    }

    .wordmark {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .header-note {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      overflow: hidden;
      border: 1px solid #dfe3d9;
      border-radius: 12px;
      background: #fffefa;
    }

    .intro {
      position: relative;
      display: grid;
      min-height: 370px;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 36px;
      padding: clamp(32px, 8vw, 88px);
      background: var(--green);
    }

    .intro::after {
      position: absolute;
      right: 29%;
      bottom: -72px;
      width: 150px;
      height: 150px;
      border: 1px solid rgb(23 42 53 / 16%);
      border-radius: 50%;
      content: "";
    }

    .intro-copy,
    .avatar {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(42px, 8vw, 78px);
      line-height: 1;
    }

    .welcome {
      max-width: 460px;
      margin: 20px 0 0;
      font-size: clamp(18px, 3vw, 23px);
      line-height: 1.5;
    }

    .avatar {
      display: grid;
      width: clamp(108px, 19vw, 168px);
      aspect-ratio: 1;
      place-items: center;
      border: 6px solid #fffefa;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 8px 8px 0 var(--yellow);
      color: var(--ink);
      font-size: clamp(38px, 7vw, 66px);
      font-weight: 900;
    }

    .details {
      display: grid;
      grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
      gap: 28px;
      padding: clamp(28px, 6vw, 58px) clamp(28px, 8vw, 88px);
    }

    .details h2 {
      margin: 0 0 12px;
      font-size: 19px;
    }

    .details p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .hobbies {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
    }

    .hobbies li {
      padding: 9px 13px;
      border-radius: 999px;
      background: #f5e4bd;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
    }

    footer {
      padding: 20px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 620px) {
      .page {
        width: min(100% - 24px, 1040px);
        padding-top: 12px;
      }

      .header-note {
        max-width: 145px;
        text-align: right;
      }

      .intro {
        min-height: auto;
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .avatar {
        grid-row: 1;
      }

      .details {
        grid-template-columns: 1fr;
        gap: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <p class="wordmark">ADAM'S PAGE</p>
      <p class="header-note">A little introduction</p>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="intro-copy">
          <p class="eyebrow">Hello, I'm</p>
          <h1 id="page-title">ADAM</h1>
          <p class="welcome">Welcome to ADAM's introduction page!</p>
        </div>
        <div class="avatar" role="img" aria-label="Avatar with the letter A">A</div>
      </section>

      <section class="details" aria-label="About ADAM">
        <div>
          <h2>About me</h2>
          <p>I'm a student at Kobe Institute of Computing.</p>
        </div>
        <div>
          <h2>Things I enjoy</h2>
          <ul class="hobbies">
            <li>Playing football</li>
            <li>Reading books</li>
            <li>Discovering new things</li>
          </ul>
        </div>
      </section>
    </main>

    <footer>Thanks for visiting!</footer>
  </div>
</body>
</html>
